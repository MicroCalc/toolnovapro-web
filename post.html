    <style>

        /* ================================
           BLOG ARTICLE
        ================================= */

        .article-wrapper {

            max-width: 900px;

            margin: 50px auto;

            padding: 0 20px;

        }


        .article-card {

            background: #ffffff !important;

            color: #111827 !important;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);

        }


        .article-category {

            display: inline-block;

            margin-bottom: 12px;

            padding: 6px 12px;

            border-radius: 20px;

            background: #eef4ff;

            color: #2563eb;

            font-size: 14px;

            font-weight: 600;

        }


        .article-title {

            margin: 0 0 15px;

            font-size: 42px;

            line-height: 1.15;

            color: #111827 !important;

        }


        .article-meta {

            margin-bottom: 30px;

            color: #64748b !important;

            font-size: 14px;

        }


        .article-image {

            width: 100%;

            max-height: 450px;

            object-fit: cover;

            border-radius: 14px;

            margin-bottom: 35px;

        }


        .article-content {

            font-size: 17px;

            line-height: 1.8;

            color: #111827 !important;

        }


        .article-content h2 {

            margin-top: 38px;

            margin-bottom: 15px;

            font-size: 28px;

            color: #111827 !important;

        }


        .article-content h3 {

            margin-top: 30px;

            font-size: 22px;

            color: #111827 !important;

        }


        .article-content p {

            margin-bottom: 18px;

            color: #111827 !important;

        }


        .article-content ul,
        .article-content ol {

            margin: 20px 0;

            padding-left: 25px;

        }


        .article-content li {

            margin-bottom: 10px;

            color: #111827 !important;

        }


        .article-content strong {

            color: #111827 !important;

        }


        .article-content a {

            color: #2563eb !important;

            font-weight: 600;

        }


        .article-content .btn {

            display: inline-block;

            margin: 10px 0;

            padding: 12px 20px;

            border-radius: 8px;

            text-decoration: none;

            color: #ffffff !important;

            background: #2563eb;

        }


        .article-content .btn:hover {

            background: #1d4ed8;

        }


        .article-back {

            margin-top: 30px;

        }


        .article-back a {

            color: #2563eb !important;

            text-decoration: none;

            font-weight: 600;

        }


        .article-error {

            text-align: center;

            padding: 60px 20px;

            color: #111827;

        }


        /* ================================
           DARK MODE
           
           The article remains WHITE
           and text remains DARK.
        ================================= */

        body.dark .article-card {

            background: #ffffff !important;

            color: #111827 !important;

        }


        body.dark .article-card .article-title {

            color: #111827 !important;

        }


        body.dark .article-card .article-content {

            color: #111827 !important;

        }


        body.dark .article-card .article-content h2,
        body.dark .article-card .article-content h3 {

            color: #111827 !important;

        }


        body.dark .article-card .article-content p,
        body.dark .article-card .article-content li,
        body.dark .article-card .article-content strong {

            color: #111827 !important;

        }


        body.dark .article-card .article-meta {

            color: #64748b !important;

        }


        body.dark .article-card .article-category {

            background: #eef4ff !important;

            color: #2563eb !important;

        }


        body.dark .article-card .article-content a {

            color: #2563eb !important;

        }


        body.dark .article-card .article-back a {

            color: #2563eb !important;

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 768px) {

            .article-wrapper {

                margin: 30px auto;

                padding: 0 15px;

            }


            .article-card {

                padding: 25px 20px;

            }


            .article-title {

                font-size: 30px;

            }


            .article-content {

                font-size: 16px;

            }


            .article-content h2 {

                font-size: 24px;

            }

        }

    </style>
