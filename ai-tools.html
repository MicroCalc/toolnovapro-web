<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Tools - ToolNova Pro
    </title>

    <meta
        name="description"
        content="Browse hundreds of AI tools for writing, coding, image generation, video editing and productivity."
    >


    <!-- ================================
         FAVICONS
    ================================= -->

    <link
        rel="icon"
        type="image/x-icon"
        href="favicon.ico"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon-32x32.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="favicon-16x16.png"
    >

    <link
        rel="apple-touch-icon"
        href="apple-touch-icon.png"
    >

    <link
        rel="manifest"
        href="site.webmanifest"
    >


    <!-- ================================
         CSS
    ================================= -->

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/header.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/cards.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/tool.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/footer.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/responsive.css"
    >

    <link
        rel="icon"
        href="favicon.ico"
    >

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header class="header">

    <div class="container">

        <a
            href="index.html"
            class="logo"
        >
            ToolNova <span>Pro</span>
        </a>


        <nav class="navbar">

            <a href="index.html">
                Home
            </a>

            <a href="ai-tools.html">
                AI Tools
            </a>

            <a href="apps.html">
                Apps
            </a>

            <a href="software.html">
                Software
            </a>

            <a href="blog.html">
                Blog
            </a>

            <a href="favorites.html">
                Favorites
            </a>

            <a href="about.html">
                About
            </a>


            <button
                id="themeToggle"
                type="button"
                aria-label="Toggle dark mode"
            >
                🌙
            </button>

        </nav>

    </div>

</header>



<!-- ================================
     PAGE HEADER
================================ -->

<section class="page-header">

    <div class="container">

        <h1>
            All AI Tools
        </h1>

        <p>
            Browse the best AI tools by category,
            pricing and popularity.
        </p>

    </div>

</section>



<!-- ================================
     AI TOOLS
================================ -->

<section class="tools-page">

    <div class="container">


        <!-- ============================
             SEARCH & FILTER
        ============================= -->

        <div class="tools-toolbar">


            <!-- Search -->

            <input
                type="text"
                id="toolSearch"
                placeholder="🔍 Search AI tools..."
                aria-label="Search AI tools"
            >


            <!-- Category -->

            <select
                id="categoryFilter"
                aria-label="Filter by category"
            >

                <option value="">
                    All Categories
                </option>

                <option value="AI Chatbot">
                    AI Chatbot
                </option>

                <option value="AI Writing">
                    AI Writing
                </option>

                <option value="AI Image">
                    AI Image
                </option>

                <option value="AI Video">
                    AI Video
                </option>

                <option value="AI Coding">
                    AI Coding
                </option>

            </select>


            <!-- Pricing -->

            <select
                id="pricingFilter"
                aria-label="Filter by pricing"
            >

                <option value="">
                    All Pricing
                </option>

                <option value="Free">
                    Free
                </option>

                <option value="Freemium">
                    Freemium
                </option>

                <option value="Paid">
                    Paid
                </option>

            </select>


            <!-- Sort -->

            <select
                id="sortTools"
                aria-label="Sort AI tools"
            >

                <option value="">
                    Sort By
                </option>

                <option value="rating">
                    Highest Rating
                </option>

                <option value="name">
                    A - Z
                </option>

            </select>


        </div>



        <!-- ============================
             DYNAMIC TOOL GRID
             
             IMPORTANT:
             tools.js loads the tools here.
        ============================= -->

        <div
            id="toolGrid"
            class="tool-grid"
        ></div>



        <!-- ============================
             PAGINATION
        ============================= -->

        <div
            id="pagination"
            class="pagination"
        ></div>


    </div>

</section>



<!-- ================================
     JAVASCRIPT
================================ -->

<script
    src="assets/js/favorites.js"
></script>


<script
    src="assets/js/tools.js"
></script>


<script
    src="assets/js/search.js"
></script>


<script
    src="assets/js/darkmode.js"
></script>


<script
    src="assets/js/main.js"
></script>


<script
    src="assets/js/darkmode.js"
></script>


<script
    src="assets/js/mobile-menu.js"
></script>


</body>

</html>
